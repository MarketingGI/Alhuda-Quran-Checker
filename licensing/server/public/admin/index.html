<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin Lisensi Alhuda</title>
<style>
:root{--bg:#f6f7f5;--fg:#1c2420;--card:#fff;--mut:#66726b;--ok:#0b7a4b;--bad:#b3261e;--warn:#9a6700;--bd:#dfe4e0}
@media(prefers-color-scheme:dark){:root{--bg:#121714;--fg:#e7ece9;--card:#1b231f;--mut:#91a098;--bd:#2c3731}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
button,input{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button{cursor:pointer}.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.approved{color:var(--ok)}.pending{color:var(--warn)}.revoked{color:var(--bad)}
.mut{color:var(--mut);font-size:13px}code{font-size:12px;word-break:break-all}
</style></head><body><main>
<h1>Lisensi Alhuda Quran Checker</h1>
<div class="card row"><input id="pw" type="password" placeholder="Password admin" autocomplete="current-password" style="flex:1;min-width:200px">
<button id="masuk" class="ok">Masuk</button></div>
<div id="info" class="mut"></div><div id="list"></div>
<script>
const $=s=>document.querySelector(s);
let PW=sessionStorage.getItem("pw")||"";
if(PW)$("#pw").value=PW;
async function api(method,body){
  const r=await fetch("/api/admin",{method,headers:{"x-admin-password":PW,"content-type":"application/json"},body:body?JSON.stringify(body):undefined});
  if(!r.ok){throw new Error(r.status==401?"Password salah":r.status==429?"Terlalu banyak percobaan, coba 15 menit lagi":"Galat "+r.status)}
  return r.json();
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function muat(){
  try{
    const d=await api("GET");
    $("#info").textContent=d.pcs.length+" PC terdaftar";
    $("#list").innerHTML=d.pcs.map(p=>`<div class="card"><div class="row"><div>
      <b>${esc(p.nama_pc)||"(tanpa nama)"}</b> — ${esc(p.pengguna)}
      <span class="tag ${p.status}">${p.status}</span>
      <div class="mut">Minta: ${esc((p.dibuat||"").slice(0,16).replace("T"," "))} · Terakhir online: ${esc((p.terakhir||"-").slice(0,16).replace("T"," "))}</div>
      <code>${p.machine_id.slice(0,16)}…</code></div><div class="row">
      ${p.status!="approved"?`<button class="ok" data-a="approve" data-m="${p.machine_id}">Setujui</button>`:""}
      ${p.status=="approved"?`<button class="bad" data-a="revoke" data-m="${p.machine_id}">Nonaktifkan</button>`:""}
      <button data-a="hapus" data-m="${p.machine_id}">Hapus</button></div></div></div>`).join("");
  }catch(e){$("#info").textContent=e.message;$("#list").innerHTML=""}
}
$("#masuk").onclick=()=>{PW=$("#pw").value;sessionStorage.setItem("pw",PW);muat()};
$("#list").onclick=async e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  if(b.dataset.a!="approve"&&!confirm("Yakin?"))return;
  try{await api("POST",{machine_id:b.dataset.m,aksi:b.dataset.a})}catch(x){alert(x.message)}
  muat();
};
if(PW)muat();
</script></main></body></html>
